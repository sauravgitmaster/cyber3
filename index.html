<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberMentor AI</title>
    <meta name="description" content="An interactive cybersecurity education framework transforming digital-safety training through scenario-based learning and AI mentoring." />
    <meta property="og:title" content="CyberMentor AI" />
    <meta property="og:description" content="An interactive cybersecurity education framework transforming digital-safety training through scenario-based learning and AI mentoring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cybermentor_theme_preference');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FDFDFD] dark:bg-black text-zinc-900 dark:text-zinc-100 antialiased font-sans selection:bg-zinc-200 dark:selection:bg-zinc-800 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
